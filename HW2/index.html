<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- A Paragraph of Text -->
    <p>This is a simple paragraph showcasing how HTML works. You can use <strong>bold text</strong> or <em>italics</em> easily.</p>

    <!-- Hyperlink -->
    <p>Visit the official <a href="https://www.w3schools.com" target="_blank">W3Schools website</a> for more tutorials.</p>

    <!-- An Image Placeholder -->
    <img src="https://placeholder.com" alt="Placeholder Image" width="150" height="150">

    <!-- Unordered List -->
    <h3>My Favorite Fruits</h3>
    <ul>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Strawberries</li>
    </ul>

</body>
</html>
